<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Moonzzz</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #e1bee7);
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      width: 100vw;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* === CLASS ĐẶC BIỆT CHỈ DÀNH CHO CHỮ MOONZZZ === */
    .moon-font {
      font-family: 'Caveat', cursive;
      font-size: 1.1em; 
      font-weight: 700;
    }

    /* === INTRO SCREEN === */
    #introScreen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: transparent; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 1.5s ease-out;
    }
    #introText {
      font-family: 'Dancing Script', cursive;
      font-size: 48px;
      color: #d81b60;
      text-align: center;
      min-height: 80px;
      padding: 0 20px;
      text-shadow: 2px 2px 4px rgba(255,255,255,0.6);
    }
    .typing-cursor::after {
      content: '|';
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    #clickToStart {
      margin-top: 30px;
      font-size: 18px;
      color: #880e4f;
      display: none;
      animation: pulseText 1.5s infinite alternate;
      cursor: pointer;
    }
    @keyframes pulseText {
      from { transform: scale(1); opacity: 0.6; }
      to { transform: scale(1.05); opacity: 1; }
    }

    /* === MÀN HÌNH CHÍNH === */
    .header-message {
      position: absolute;
      top: 4vh; 
      width: 100%;
      text-align: center;
      font-size: 42px;
      font-family: 'Dancing Script', cursive;
      color: #d81b60;
      text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.8);
      z-index: 30; 
      display: none;
      animation: fadeInDown 1.5s ease;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === HỘP QUÀ GLASSMORPHISM & GLOW === */
    .gift-container {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: none;
      cursor: pointer;
    }
    .gift-box {
      width: 180px;
      height: auto;
      transition: transform 0.3s ease;
      animation: floatGift 3s ease-in-out infinite, glowGift 2s alternate infinite;
      border-radius: 20px;
    }
    .gift-container:hover .gift-box {
      transform: scale(1.15);
    }
    @keyframes floatGift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes glowGift {
      0% { filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.5)); }
      100% { filter: drop-shadow(0 0 25px rgba(255, 105, 180, 0.9)); }
    }
    .sparkle {
      position: absolute;
      width: 10px; height: 10px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px 2px white;
      animation: twinkle 1.5s infinite;
      pointer-events: none;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .gift-message {
      position: absolute;
      top: calc(50% + 130px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      color: #d81b60;
      font-family: 'Dancing Script', cursive;
      font-weight: bold;
      text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
      display: none;
      z-index: 10;
      animation: pulseTextCentered 1.5s infinite alternate;
      white-space: nowrap;
    }
    @keyframes pulseTextCentered {
      from { transform: translateX(-50%) scale(1); opacity: 0.6; }
      to { transform: translateX(-50%) scale(1.05); opacity: 1; }
    }

    /* === KHUNG ẢNH ĐƠN === */
    .moment-container {
      position: absolute;
      top: 50%; 
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85vw;
      height: 65vh; 
      max-width: 800px;
      display: none;
      z-index: 15; 
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .moment-single {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain; 
      opacity: 0;
      transform: scale(1);
      transition: opacity 2s ease-in-out;
    }
    .moment-single.active {
      opacity: 1;
      animation: slowZoom 35s linear forwards; 
    }
    @keyframes slowZoom {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    /* CAPTION NẰM NGOÀI KHUNG ẢNH */
    .caption-box {
      position: absolute;
      bottom: 5vh; 
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      padding: 12px 30px;
      border-radius: 30px;
      color: #880e4f;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 18px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      opacity: 0;
      transition: opacity 1s ease;
      white-space: nowrap;
      z-index: 20; 
      pointer-events: none;
    }
    .caption-box.active {
      opacity: 1;
    }

    /* === LETTER POPUP GLASSMORPHISM === */
    .letter-popup {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 90%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      z-index: 25;
      display: none;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .letter-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .letter-content {
      font-family: 'Dancing Script', cursive;
      color: #c2185b;
      font-size: 32px;
      line-height: 1.6;
      text-align: center;
      min-height: 200px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #introText { font-size: 36px; }
      .header-message { font-size: 30px; top: 4vh; }
      .moment-container { width: 90vw; height: 50vh; top: 48%; }
      .caption-box { font-size: 14px; bottom: 6vh; padding: 10px 20px; }
      .letter-content { font-size: 24px; }
    }
  </style>
</head>
<body>

<audio id="birthdayMusic" src="img/hpbd.mp3" loop></audio>

<!-- INTRO SCREEN -->
<div id="introScreen">
  <div id="introText" class="typing-cursor"></div>
  <div id="clickToStart">Chạm vào màn hình nhé...</div>
</div>

<canvas id="canvas"></canvas>

<div class="header-message">Hãy luôn vui vẻ và cười thật tươi như này nhé!!!</div>

<!-- HỘP QUÀ -->
<div class="gift-container" id="giftBox">
  <div class="sparkle" style="top: 10%; left: 10%; animation-delay: 0s;"></div>
  <div class="sparkle" style="top: 20%; right: 10%; animation-delay: 0.5s;"></div>
  <div class="sparkle" style="bottom: 20%; left: 20%; animation-delay: 1s;"></div>
  <div class="sparkle" style="bottom: 10%; right: 20%; animation-delay: 0.2s;"></div>
  <img src="https://png.pngtree.com/png-clipart/20220125/original/pngtree-gift-box-gift-box-png-image_7213113.png" alt="Gift box" class="gift-box">
</div>
<div class="gift-message" id="giftMessage"><span class="moon-font">Moonzzz</span> mở quà đi nàoo 🎁</div>

<!-- KHUNG CHỨA 1 ẢNH DUY NHẤT -->
<div class="moment-container" id="momentContainer">
  <img src="img/Moonzzz.jpg" class="moment-single" id="singleImage">
</div>
<!-- CAPTION NẰM NGOÀI KHUNG ẢNH -->
<div class="caption-box" id="captionBox"></div>

<!-- LÁ THƯ CUỐI CÙNG -->
<div class="letter-popup" id="letterPopup">
  <div class="letter-content typing-cursor" id="letterContent"></div>
</div>

<script>
// === KHỞI TẠO BIẾN ===
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
let time = 0;

let clickState = -1; // -1: Intro, 0: Cake, 1: Gift, 2: Slideshow, 3: Letter
let cakeOpacity = 0; 
let animationStarted = false;

const introTexts = [
  "Này <span class='moon-font'>Moonzzz</span>...",
  "Hôm nay là một ngày đặc biệt nhỉ?",
  "Tui có một món quà nhỏ dành cho <span class='moon-font'>Moonzzz</span> nè 💖"
];
const introTextEl = document.getElementById("introText");
const clickToStartEl = document.getElementById("clickToStart");
const introScreen = document.getElementById("introScreen");
const birthdayMusic = document.getElementById("birthdayMusic");

let introLineIdx = 0;
let introCharIdx = 0;
let isIntroTyping = true;
let currentParsedIntro = "";

function typeIntro() {
  if (introLineIdx < introTexts.length) {
    clickToStartEl.style.display = "none";
    const lineChars = [...introTexts[introLineIdx]];

    if (introCharIdx < lineChars.length) {
      if (lineChars[introCharIdx] === '<') {
        let tag = "";
        while (introCharIdx < lineChars.length && lineChars[introCharIdx] !== '>') {
          tag += lineChars[introCharIdx];
          introCharIdx++;
        }
        tag += '>';
        currentParsedIntro += tag;
        introCharIdx++; 
        typeIntro();
        return;
      }

      currentParsedIntro += lineChars[introCharIdx];
      introTextEl.innerHTML = currentParsedIntro;
      introCharIdx++;
      setTimeout(typeIntro, 100);
      
    } else {
      if (introLineIdx === introTexts.length - 1) {
        clickToStartEl.style.display = "block";
        isIntroTyping = false;
        introTextEl.classList.remove('typing-cursor');
      } else {
        setTimeout(() => {
          introCharIdx = 0;
          introLineIdx++;
          currentParsedIntro = ""; 
          introTextEl.innerHTML = "";
          typeIntro();
        }, 1500); 
      }
    }
  }
}
window.onload = typeIntro;

// === TỌA ĐỘ VÀ CẤU HÌNH VẼ CANVAS ===
const cake = { x: W / 2, y: H / 2 + 50, width: 320, height: 65, tiers: 3 };
const tierColors = ["#f8bbd0", "#f48fb1", "#f06292"]; 
const candles = [
  { offset: -70, flame: true, color: "#fff" },
  { offset: -35, flame: true, color: "#fff" },
  { offset: 0, flame: true, color: "#fff" },
  { offset: 35, flame: true, color: "#fff" },
  { offset: 70, flame: true, color: "#fff" }
];
const confetti = [];
const flyingHearts = []; 

// Mảng chứa bong bóng nước (để rỗng ban đầu)
const waterBubbles = [];

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cake.x = W / 2;
  cake.y = H / 2 + 50;
});

// === CÁC HÀM VẼ CANVAS ===
function drawWaterBubbles() {
  // Thêm dần bong bóng từ dưới đáy lên giống y hệt như trái tim
  if (waterBubbles.length < 40) {
    waterBubbles.push({
      x: Math.random() * W,
      y: H + Math.random() * 100, // Bắt đầu từ dưới đáy màn hình
      size: 4 + Math.random() * 12,
      speedY: 0.5 + Math.random() * 1.5,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.01 + Math.random() * 0.03
    });
  }

  waterBubbles.forEach(b => {
    ctx.save();
    b.wobble += b.wobbleSpeed;
    let currentX = b.x + Math.sin(b.wobble) * 15;

    // Vẽ bong bóng mờ
    ctx.beginPath();
    ctx.arc(currentX, b.y, b.size, 0, Math.PI * 2);
    
    // Gradient 3D cho bong bóng
    let grad = ctx.createRadialGradient(
      currentX - b.size * 0.3, b.y - b.size * 0.3, b.size * 0.1, 
      currentX, b.y, b.size
    );
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
    grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.1)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0.4)');
    
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Điểm nhấn sáng trắng (reflection)
    ctx.beginPath();
    ctx.arc(currentX - b.size * 0.35, b.y - b.size * 0.35, b.size * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fill();

    ctx.restore();

    // Di chuyển bong bóng lên trên
    b.y -= b.speedY;
    // Nếu bay quá màn hình thì reset lại từ dưới đáy
    if (b.y < -50) {
      b.y = H + 50;
      b.x = Math.random() * W;
    }
  });
}

function drawCake() {
  ctx.globalAlpha = cakeOpacity;
  const tierHeight = cake.height;
  for (let i = 0; i < cake.tiers; i++) {
    const tierWidth = cake.width - i * 50;
    const x = cake.x - tierWidth / 2;
    const y = cake.y - i * tierHeight;
    ctx.beginPath();
    ctx.fillStyle = tierColors[i];
    ctx.roundRect ? ctx.roundRect(x, y, tierWidth, tierHeight, 10) : ctx.fillRect(x, y, tierWidth, tierHeight);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 2;
    if(ctx.roundRect) ctx.strokeRect(x, y, tierWidth, tierHeight, 10);

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    let dripWidth = 20;
    for (let j = 0; j < tierWidth; j += dripWidth) {
      let dripOffset = Math.sin((j + i*10) * 0.5) * 8 + 12;
      ctx.arc(x + j + dripWidth/2, y + 2, dripWidth/2 + 2, Math.PI, 0, true);
      ctx.arc(x + j + dripWidth/2, y + dripOffset, dripWidth/2, 0, Math.PI, false);
    }
    ctx.fill();
    
    ctx.fillStyle = "#d81b60";
    for(let k = 15; k < tierWidth - 15; k += 40) {
      drawMiniHeart(x + k, y + tierHeight/2 + 5, 4);
    }
  }
  ctx.globalAlpha = 1;
}

function drawMiniHeart(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, size);
  ctx.bezierCurveTo(-size, 0, -size, -size, 0, -size/2);
  ctx.bezierCurveTo(size, -size, size, 0, 0, size);
  ctx.fill();
  ctx.restore();
}

function drawCandles() {
  if (cakeOpacity <= 0) return;
  const topY = cake.y - (cake.tiers - 1) * cake.height;
  candles.forEach(c => {
    const cx = cake.x + c.offset;
    const cy = topY - 35; 
    ctx.fillStyle = c.color;
    ctx.fillRect(cx - 5, cy, 10, 35);
    ctx.strokeStyle = "#f06292";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy + 5); ctx.lineTo(cx + 5, cy + 10);
    ctx.moveTo(cx - 5, cy + 15); ctx.lineTo(cx + 5, cy + 20);
    ctx.moveTo(cx - 5, cy + 25); ctx.lineTo(cx + 5, cy + 30);
    ctx.stroke();

    if (c.flame) {
      ctx.save();
      const flicker = Math.sin(time / 5 + c.offset) * 1.5;
      const flameHeight = 18 + Math.random() * 2;
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#ffeb3b";
      ctx.beginPath();
      ctx.moveTo(cx, cy - flameHeight); 
      ctx.bezierCurveTo(
        cx + 6 + flicker, cy - flameHeight/2, cx + 6, cy - 2, cx, cy - 2
      );
      ctx.bezierCurveTo(
        cx - 6, cy - 2, cx - 6 + flicker, cy - flameHeight/2, cx, cy - flameHeight
      );
      const grd = ctx.createLinearGradient(cx, cy - flameHeight, cx, cy);
      grd.addColorStop(0, "#ffeb3b"); 
      grd.addColorStop(1, "#ff9800"); 
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.restore();
    }
  });
}

function drawConfetti() {
  if (confetti.length < 80) {
    confetti.push({
      x: Math.random() * W, y: -10,
      color: `hsl(${Math.random() * 360}, 80%, 60%)`,
      size: 6 + Math.random() * 4, speedY: 2 + Math.random() * 3,
      speedX: -1 + Math.random() * 2, rotation: Math.random() * 360, rotSpeed: -5 + Math.random() * 10
    });
  }
  confetti.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation * Math.PI / 180);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size * 0.5); 
    ctx.restore();
    c.y += c.speedY; c.x += c.speedX; c.rotation += c.rotSpeed;
    if (c.y > H) { c.y = -20; c.x = Math.random() * W; }
  });
}

function drawFlyingHearts() {
  if (flyingHearts.length < 25) {
    flyingHearts.push({
      x: Math.random() * W, y: H + Math.random() * 100,
      size: 10 + Math.random() * 15, speedY: 1 + Math.random() * 2,
      alpha: 0.3 + Math.random() * 0.5, wobble: Math.random() * Math.PI * 2
    });
  }
  flyingHearts.forEach(h => {
    ctx.save();
    h.wobble += 0.02;
    let currentX = h.x + Math.sin(h.wobble) * 20;
    ctx.globalAlpha = h.alpha;
    ctx.fillStyle = "#ff4081";
    drawMiniHeart(currentX, h.y, h.size);
    ctx.restore();
    h.y -= h.speedY;
    if (h.y < -50) { h.y = H + 50; h.x = Math.random() * W; }
  });
}

function loop() {
  time++;
  ctx.clearRect(0, 0, W, H);
  
  if (animationStarted) {
    // Gọi chung vào cùng một cờ với trái tim và pháo giấy
    drawWaterBubbles();
    drawConfetti();
    drawFlyingHearts();
  }
  if (cakeOpacity > 0) {
    drawCake(); drawCandles();
  }
  requestAnimationFrame(loop);
}
loop();

function handleInteraction(e) {
  if (isIntroTyping) return; 
  
  if (clickState === -1) {
    clickState = 0;
    birthdayMusic.load();
    let playPromise = birthdayMusic.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => console.log("Audio play error", err));
    }
    introScreen.style.opacity = 0;
    setTimeout(() => { introScreen.style.display = "none"; }, 1500);
    let cakeFadeIn = setInterval(() => {
      cakeOpacity += 0.02;
      if (cakeOpacity >= 1) {
        cakeOpacity = 1;
        clearInterval(cakeFadeIn);
        setTimeout(() => {
          candles.forEach(c => c.flame = false);
          let cakeFadeOut = setInterval(() => {
            cakeOpacity -= 0.03;
            if (cakeOpacity <= 0) {
              cakeOpacity = 0;
              clearInterval(cakeFadeOut);
              // Kích hoạt cờ này sẽ làm xuất hiện trái tim, pháo giấy và BONG BÓNG NƯỚC
              animationStarted = true;
              document.getElementById("giftBox").style.display = "block";
              document.getElementById("giftMessage").style.display = "block";
              clickState = 1; 
            }
          }, 50);
        }, 4000);
      }
    }, 50);
  }
}

window.addEventListener("click", handleInteraction);
window.addEventListener("touchstart", handleInteraction);

// === LOGIC HÌNH ẢNH ĐƠN (1 ẢNH) VÀ ĐỔI CAPTION ===
const singleImage = document.getElementById("singleImage");
const captionBox = document.getElementById("captionBox");
const momentContainer = document.getElementById("momentContainer");
const headerMessage = document.querySelector(".header-message");

const slideCaptions = [
  "📸 Một chiếc ảnh mang theo 100% sự dễ thương",
  "🌷 Nhẹ nhàng như nắng, đáng yêu như hoa",
  "🐰 Được tạo nên từ một chút dễ thương và thật nhiều đáng yêu",
  "✨ Nhìn một lần là nhớ, nhìn hai lần là thương",
  "🌸 Chúc cho những nụ cười luôn ở trên môi",
  "☁️ Chúc cho những ngày buồn sẽ sớm trôi qua",
  "💖 Chúc cho mọi mong ước đều thành hiện thực",
  "❤️ Luôn hạnh phúc, bình an và cười thật nhiều nha <span class='moon-font'>Moonzzz</span> 🌸"
];

let captionIndex = 0;
const CAPTION_DURATION = 4000; 

document.getElementById("giftBox").addEventListener("click", (e) => {
  e.stopPropagation();
  if(clickState !== 1) return;
  clickState = 2; 

  document.getElementById("giftBox").style.display = "none";
  document.getElementById("giftMessage").style.display = "none";
  momentContainer.style.display = "block";
  headerMessage.style.display = "block";

  for(let i=0; i<30; i++) {
     confetti.push({
      x: W/2, y: H/2, color: `hsl(${Math.random() * 360}, 100%, 50%)`,
      size: 8 + Math.random() * 5, speedY: -10 + Math.random() * 20, speedX: -10 + Math.random() * 20,
      rotation: 0, rotSpeed: Math.random()*20
    });
  }
  
  runSingleImageLogic();
});

function runSingleImageLogic() {
  singleImage.classList.add("active"); 
  captionIndex = 0;

  function updateCaption() {
    captionBox.classList.remove("active"); 
    
    setTimeout(() => {
        captionBox.innerHTML = slideCaptions[captionIndex];
        captionBox.classList.add("active");
        captionIndex++;
    }, 500); 
  }

  updateCaption();

  let captionInterval = setInterval(() => {
    if (captionIndex >= slideCaptions.length) {
      clearInterval(captionInterval);
      captionBox.classList.remove("active"); 
      setTimeout(showLetterPopup, 1000);
    } else {
      updateCaption();
    }
  }, CAPTION_DURATION);
}

// === FINAL LETTER LOGIC ===
const finalMessage = "💖 Chúc <span class='moon-font'>Moonzzz</span> sinh nhật vui vẻ 💖\n\nMong tuổi mới sẽ mang đến cho cậu thật nhiều niềm vui, thật nhiều tiếng cười và thật nhiều điều may mắn.\nCảm ơn vì đã xuất hiện trong cuộc sống này.\n\n🌷 Hãy luôn hạnh phúc nhé 🌷";
const letterPopup = document.getElementById("letterPopup");
const letterContentEl = document.getElementById("letterContent");
const finalMessageChars = [...finalMessage]; 
let letterCharIdx = 0;
let currentLetterString = "";

function showLetterPopup() {
  momentContainer.style.display = "none";
  headerMessage.style.display = "none";
  letterPopup.style.display = "block";
  setTimeout(() => { letterPopup.classList.add("show"); }, 100);
  setTimeout(typeLetter, 1000);
}

function typeLetter() {
  if (letterCharIdx < finalMessageChars.length) {
    if (finalMessageChars[letterCharIdx] === '<') {
        let tag = "";
        while(letterCharIdx < finalMessageChars.length && finalMessageChars[letterCharIdx] !== '>') {
            tag += finalMessageChars[letterCharIdx];
            letterCharIdx++;
        }
        tag += '>';
        currentLetterString += tag;
        letterCharIdx++;
        typeLetter();
        return;
    }

    let char = finalMessageChars[letterCharIdx];
    if(char === '\n') {
      currentLetterString += '<br>';
    } else {
      currentLetterString += char;
    }
    
    letterContentEl.innerHTML = currentLetterString;
    letterCharIdx++;
    setTimeout(typeLetter, 60);
  } else {
    letterContentEl.classList.remove('typing-cursor');

    setTimeout(() => {
       let fadeAudio = setInterval(() => {
         if (birthdayMusic.volume > 0.1) {
           birthdayMusic.volume -= 0.1;
         } else {
           clearInterval(fadeAudio);
           birthdayMusic.pause();
         }
       }, 500);
    }, 15000);
  }
}
